<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best adventure website creator | WhiteWater Rafting</title>
    <meta name="description"
        content="We are the best adventure website creator in town whitewater Rafting🐬, everybody likes rafting and we gonna get to the moon very soon.">
    <meta name="author" content="Damola Olalekan">
    <link rel="stylesheet" href="styles/rafting.css">

</head>


<body>
    <header>
        <img src="images/wwrblue.jpg" alt="WhiteWater Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>23 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>

        <section class="contact-section">
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d46697.468693881914!2d-78.99213517063873!3d42.98687184929786!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89d36ba33bee43fb%3A0x12a8795b7493cda2!2sGrandyle%20Village%2C%20NY%2C%20USA!5e0!3m2!1sen!2sca!4v1764541741263!5m2!1sen!2sca"
                    width="350" height="300" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form class="contact-form">

                <div class="name">
                    <label for="Name">Name</label>
                    <input type="text" id="Name" placeholder="Placeholder">
                </div>

                <div class="email">
                    <label for="Email">Email</label>
                    <input type="text" id="Email" name="Email" required placeholder="Placeholder">
                </div>

                <div class="flex">
                    <label for="">Message Purpose</label>
                    <div class="radio-group">
                        <label for="Purpose"><input type="radio" name="Purpose" id="Purpose"> General Inquiry</label>
                        <label for="Purpose"><input type="radio" name="Purpose" id="Purpose"> Reservation
                            Question</label>
                        <label for="Purpose"><input type="radio" name="Purpose" id="Purpose"> Website Suggestion</label>
                    </div>
                </div>

                <label for="message">Message</label>
                <textarea name="message" placeholder="Type here..."></textarea>

                <label class="newsletter">
                    <input type="checkbox"> Please Subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>



        <section class="adventure">
            <h2> We are Here to Serve You</h2>
            <div class="adventures-flex">
                <figure>
                    <img src="images/adventure-1.jpg" alt="Los Dientes del Diablo">
                    <figcaption>Los Dientes del Diablo</figcaption>
                </figure>
                <figure>
                    <img src="images/adventure-2.jpg" alt="Big Mallard Rapid">
                    <figcaption>Big Mallard</figcaption>
                </figure>
                <figure>
                    <img src="images/adventure-3.jpg" alt="Half Day Adventure">
                    <figcaption>Half Day Adventure</figcaption>
                </figure>

            </div>

        </section>
    </main>



    <footer>
        <p>©️2025 🐬WhiteWater Rafting🐬 Damola Olalekan</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
